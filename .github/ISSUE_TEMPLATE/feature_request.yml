name: Feature or Enhancement Request
description: Suggest an idea or enhancement for Kamal Watch
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for submitting a feature request! If you are an AI agent, please review [CONTRIBUTING.md](../../CONTRIBUTING.md) before submitting.
  - type: textarea
    id: problem-or-use-case
    attributes:
      label: Problem or Use Case
      description: Is your feature request related to a problem or a specific architectural use case?
      placeholder: A clear and concise description of what problem you are trying to solve or what functionality is missing.
    validations:
      required: true
  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: A clear and concise description of what you want to happen.
      placeholder: Describe the technical implementation, API changes, or configuration additions.
    validations:
      required: true
  - type: textarea
    id: code-locations
    attributes:
      label: Relevant Code Locations
      description: Target files, packages, or interfaces that would be affected.
      placeholder: e.g. pkg/monitor/monitor.go, pkg/remote/ssh.go
    validations:
      required: false
  - type: textarea
    id: alternatives-considered
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered.
    validations:
      required: false
