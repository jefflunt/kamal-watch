# Bind to 127.0.0.1 when running locally; use ":8080" inside Docker/Kamal on a private network
listen_addr: "127.0.0.1:8080"
poll_interval: 4s
# Maximum concurrent /logs/stream SSH sessions per server (defaults to 6)
# max_concurrent_log_streams: 6
# Path to SSH known_hosts file (defaults to ~/.ssh/known_hosts)
# known_hosts_path: ~/.ssh/known_hosts

# Optional HTTP Basic Auth (or set KAMAL_WATCH_AUTH_USER / KAMAL_WATCH_AUTH_PASSWORD env vars)
# auth:
#   username: admin
#   password: change-me

# Optional Host header allowlist (protects against DNS rebinding; loopback binds enforce localhost/127.0.0.1 automatically)
# allowed_hosts:
#   - localhost
#   - 127.0.0.1
#   - watch.internal

servers:
  - name: app-server-01
    host: 10.0.1.10
    port: 22
    user: deploy
    key_path: ~/.ssh/id_ed25519
    # known_hosts_path: ~/.ssh/known_hosts
    # insecure_ignore_host_key: false
