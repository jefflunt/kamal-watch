<!-- Screen Takeover Command Modal -->
<div id="cmd-modal" onclick="if(event.target === this) closeCmdModal()" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 transition-opacity">
  <div class="w-full max-w-2xl bg-[#161b22] border border-[#30363d] rounded-lg shadow-2xl p-5 flex flex-col space-y-4">
    <div>
      <h3 class="text-white font-mono font-bold text-sm sm:text-base">
        Run the following command on <span id="cmd-modal-host" class="text-[#58a6ff]"></span>?
      </h3>
    </div>

    <div>
      <input type="text" id="cmd-modal-input" placeholder="e.g. sudo apt-get update && sudo apt-get dist-upgrade" class="w-full min-w-[40ch] bg-[#0d1117] border border-[#30363d] focus:border-[#58a6ff] focus:ring-1 focus:ring-[#58a6ff] rounded px-3 py-2 text-white font-mono text-xs placeholder-[#6e7681] outline-none" spellcheck="false" autocomplete="off" oninput="handleCmdModalInput(this.value)">
    </div>

    <!-- Output Box (hidden initially) -->
    <div id="cmd-modal-output-box" class="hidden font-mono text-[11px] bg-[#0d1117] border border-[#30363d] rounded p-3 max-h-60 overflow-y-auto whitespace-pre-wrap break-all select-text leading-relaxed">
    </div>

    <div class="flex items-center justify-end gap-3 pt-2">
      <button type="button" id="cmd-modal-cancel-btn" onclick="closeCmdModal()" class="px-4 py-1.5 rounded bg-[#21262d] hover:bg-[#30363d] text-[#c9d1d9] hover:text-white font-mono text-xs border border-[#30363d] transition-colors cursor-pointer">
        Cancel
      </button>
      <button type="button" id="cmd-modal-yes-btn" onclick="runCmdModalAction()" disabled class="px-4 py-1.5 rounded bg-[#238636] hover:bg-[#2ea043] disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-[#238636] text-white font-mono text-xs font-semibold transition-colors cursor-pointer">
        Yes
      </button>
    </div>
  </div>
</div>

<script>
  let cmdModalServer = '';
  let cmdModalHost = '';
  let cmdModalType = '';
  let cmdModalRunning = false;

  function getStorageKey(type, host) {
    return 'kamal-watch-cmd-' + type + '-' + host;
  }

  function openCommandModal(serverName, host, type) {
    cmdModalServer = serverName;
    cmdModalHost = host;
    cmdModalType = type;
    cmdModalRunning = false;

    const hostSpan = document.getElementById('cmd-modal-host');
    if (hostSpan) hostSpan.textContent = host;

    const savedCmd = localStorage.getItem(getStorageKey(type, host)) || '';
    const input = document.getElementById('cmd-modal-input');
    if (input) {
      input.value = savedCmd;
      input.disabled = false;
    }

    const outputBox = document.getElementById('cmd-modal-output-box');
    if (outputBox) {
      outputBox.classList.add('hidden');
      outputBox.innerHTML = '';
    }

    const cancelBtn = document.getElementById('cmd-modal-cancel-btn');
    if (cancelBtn) cancelBtn.textContent = 'Cancel';

    const yesBtn = document.getElementById('cmd-modal-yes-btn');
    if (yesBtn) {
      yesBtn.disabled = savedCmd.trim().length === 0;
      yesBtn.textContent = 'Yes';
    }

    const modal = document.getElementById('cmd-modal');
    if (modal) {
      modal.classList.remove('hidden');
      if (input) {
        setTimeout(() => input.focus(), 50);
      }
    }
  }

  function handleCmdModalInput(val) {
    if (cmdModalType && cmdModalHost) {
      localStorage.setItem(getStorageKey(cmdModalType, cmdModalHost), val);
    }
    const yesBtn = document.getElementById('cmd-modal-yes-btn');
    if (yesBtn && !cmdModalRunning) {
      yesBtn.disabled = val.trim().length === 0;
    }
  }

  function closeCmdModal() {
    const modal = document.getElementById('cmd-modal');
    if (modal) modal.classList.add('hidden');
    cmdModalRunning = false;
  }

  async function runCmdModalAction() {
    const input = document.getElementById('cmd-modal-input');
    const cmd = input ? input.value.trim() : '';
    if (!cmd || cmdModalRunning) return;

    cmdModalRunning = true;
    const yesBtn = document.getElementById('cmd-modal-yes-btn');
    const cancelBtn = document.getElementById('cmd-modal-cancel-btn');
    const outputBox = document.getElementById('cmd-modal-output-box');

    if (yesBtn) {
      yesBtn.disabled = true;
      yesBtn.textContent = 'Running...';
    }
    if (input) input.disabled = true;
    if (outputBox) {
      outputBox.classList.remove('hidden');
      outputBox.className = "font-mono text-[11px] bg-[#0d1117] border border-[#30363d] rounded p-3 max-h-60 overflow-y-auto whitespace-pre-wrap break-all select-text leading-relaxed text-[#8b949e]";
      outputBox.textContent = `==> Executing on ${cmdModalHost}...\n$ ${cmd}\n\n`;
    }

    try {
      const res = await fetch('/api/server/' + encodeURIComponent(cmdModalServer) + '/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ command: cmd })
      });

      const data = await res.json();
      cmdModalRunning = false;
      if (input) input.disabled = false;

      if (outputBox) {
        let text = outputBox.textContent;
        if (data.output) {
          text += data.output + '\n';
        }
        if (data.success) {
          outputBox.className = "font-mono text-[11px] bg-[#0d1117] border border-[#238636] rounded p-3 max-h-60 overflow-y-auto whitespace-pre-wrap break-all select-text leading-relaxed text-[#7ee787]";
          text += `\n==> Command completed successfully.`;
        } else {
          outputBox.className = "font-mono text-[11px] bg-[#0d1117] border border-[#da3633] rounded p-3 max-h-60 overflow-y-auto whitespace-pre-wrap break-all select-text leading-relaxed text-[#f85149]";
          text += `\n==> Command exited with error: ${data.error || 'Unknown error'}`;
        }
        outputBox.textContent = text;
        outputBox.scrollTop = outputBox.scrollHeight;
      }

      if (yesBtn) {
        yesBtn.disabled = false;
        yesBtn.textContent = 'Run Again';
      }
      if (cancelBtn) {
        cancelBtn.textContent = 'Close';
      }
    } catch (err) {
      cmdModalRunning = false;
      if (input) input.disabled = false;
      if (outputBox) {
        outputBox.className = "font-mono text-[11px] bg-[#0d1117] border border-[#da3633] rounded p-3 max-h-60 overflow-y-auto whitespace-pre-wrap break-all select-text leading-relaxed text-[#f85149]";
        outputBox.textContent += `\n==> Request failed: ${err.message}`;
      }
      if (yesBtn) {
        yesBtn.disabled = false;
        yesBtn.textContent = 'Run Again';
      }
      if (cancelBtn) cancelBtn.textContent = 'Close';
    }
  }

  // Keybindings for command modal
  document.addEventListener('keydown', function(e) {
    const modal = document.getElementById('cmd-modal');
    if (!modal || modal.classList.contains('hidden')) return;

    if (e.key === 'Escape') {
      closeCmdModal();
    } else if (e.key === 'Enter' && e.target && e.target.id === 'cmd-modal-input') {
      e.preventDefault();
      const yesBtn = document.getElementById('cmd-modal-yes-btn');
      if (yesBtn && !yesBtn.disabled) {
        runCmdModalAction();
      }
    }
  });
</script>
