<!-- Screen Takeover Command Modal -->
<div id="cmd-modal" onclick="if(event.target === this) closeCmdModal()" class="fixed inset-0 z-50 hidden bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 transition-opacity" style="justify-content:center;box-sizing:border-box;">
  <div class="bg-[#161b22] border border-[#30363d] rounded-md shadow-2xl flex flex-col max-h-[85vh] overflow-hidden" style="width:95%;max-width:1200px;max-height:85vh;box-sizing:border-box;margin:auto;">
    <!-- Modal Header -->
    <div class="px-5 py-3.5 bg-[#1f242c] border-b border-[#30363d] flex items-center justify-between">
      <h3 class="text-white font-mono font-bold text-sm sm:text-base flex items-center gap-2">
        <span class="inline-block w-2.5 h-2.5 rounded-full bg-[#58a6ff]"></span>
        <span>Run the following command on <span id="cmd-modal-host" class="text-[#58a6ff]"></span>?</span>
      </h3>
      <button type="button" onclick="closeCmdModal()" title="Close (Esc)" class="text-[#8b949e] hover:text-white font-mono text-sm px-2 py-0.5 rounded hover:bg-[#30363d] transition-colors cursor-pointer">
        ✕
      </button>
    </div>

    <!-- Command Input Section -->
    <div class="p-5 bg-[#161b22] border-b border-[#30363d] flex flex-col space-y-2">
      <label for="cmd-modal-input" class="text-[11px] font-mono font-semibold uppercase tracking-wider text-[#8b949e]">
        Command
      </label>
      <div class="flex items-center bg-[#0d1117] border border-[#30363d] focus-within:border-[#58a6ff] rounded px-3 py-2">
        <span class="text-[#7ee787] font-mono text-xs font-bold mr-2 select-none">$</span>
        <input type="text" id="cmd-modal-input" placeholder="e.g. sudo apt-get update && sudo apt-get dist-upgrade" class="w-full bg-transparent text-white font-mono text-xs placeholder-[#6e7681] outline-none border-0 p-0 focus:ring-0" style="min-width:40ch;box-sizing:border-box;" spellcheck="false" autocomplete="off" oninput="handleCmdModalInput(this.value)">
      </div>
      <p class="text-[11px] font-mono text-[#8b949e]">
        Enter the shell command to execute remotely via SSH.
      </p>
    </div>

    <!-- Output Section (hidden initially) -->
    <div id="cmd-modal-output-section" class="hidden flex-1 min-h-0 flex flex-col bg-[#0c1017] p-5 border-b border-[#30363d]">
      <div class="flex items-center justify-between pb-2 mb-2 border-b border-[#21262d]">
        <div class="flex items-center gap-2">
          <span class="text-[11px] font-mono font-semibold uppercase tracking-wider text-[#8b949e]">Output</span>
          <span id="cmd-modal-status-badge" class="px-1.5 py-0.5 rounded text-[10px] font-mono bg-[#21262d] text-[#8b949e]">Ready</span>
        </div>
        <div class="flex items-center gap-4 text-xs font-mono">
          <label class="inline-flex items-center gap-1.5 cursor-pointer text-[#8b949e] hover:text-[#c9d1d9] select-none">
            <input type="checkbox" id="cmd-modal-autoscroll" checked class="accent-[#238636] cursor-pointer" style="accent-color:#238636;">
            <span>Auto-scroll</span>
          </label>
          <button type="button" onclick="clearCmdOutput()" class="text-[#8b949e] hover:text-[#c9d1d9] underline cursor-pointer">
            Clear
          </button>
        </div>
      </div>
      <div id="cmd-modal-output-box" class="flex-1 min-h-0 font-mono text-[11px] bg-[#0d1117] border border-[#30363d] rounded p-3 overflow-y-auto overflow-x-auto whitespace-pre-wrap break-all select-text leading-relaxed text-[#8b949e] max-h-[55vh]" style="min-height:160px;max-height:55vh;overscroll-behavior:contain;"></div>
    </div>

    <!-- Modal Footer Actions -->
    <div class="px-5 py-3.5 bg-[#1f242c] flex items-center justify-between">
      <div class="text-[11px] font-mono text-[#8b949e] hidden sm:block">
        Press <span class="px-1.5 py-0.5 rounded bg-[#0d1117] border border-[#30363d] text-white">Enter</span> to run &bull; <span class="px-1.5 py-0.5 rounded bg-[#0d1117] border border-[#30363d] text-white">Esc</span> to cancel
      </div>
      <div class="flex items-center justify-end gap-3 ml-auto">
        <button type="button" id="cmd-modal-cancel-btn" onclick="closeCmdModal()" class="px-4 py-1.5 rounded bg-[#21262d] hover:bg-[#30363d] text-[#c9d1d9] hover:text-white font-mono text-xs border border-[#30363d] transition-colors cursor-pointer">
          Cancel
        </button>
        <button type="button" id="cmd-modal-yes-btn" onclick="runCmdModalAction()" disabled class="px-4 py-1.5 rounded bg-[#238636] hover:bg-[#2ea043] disabled:opacity-40 disabled:cursor-not-allowed disabled:hover:bg-[#238636] text-white font-mono text-xs font-semibold transition-colors cursor-pointer">
          Yes
        </button>
      </div>
    </div>
  </div>
</div>

<script>
  let cmdModalServer = '';
  let cmdModalHost = '';
  let cmdModalType = '';
  let cmdModalRunning = false;

  function getStorageKey(type, host) {
    return 'kamal-watch-cmd-' + type + '-' + host;
  }

  function scrollToBottomIfAuto() {
    const autoscroll = document.getElementById('cmd-modal-autoscroll');
    const outputBox = document.getElementById('cmd-modal-output-box');
    if (outputBox && (!autoscroll || autoscroll.checked)) {
      outputBox.scrollTop = outputBox.scrollHeight;
    }
  }

  function clearCmdOutput() {
    const outputBox = document.getElementById('cmd-modal-output-box');
    if (outputBox) {
      outputBox.textContent = '';
    }
  }

  function setStatusBadge(status, text) {
    const badge = document.getElementById('cmd-modal-status-badge');
    if (!badge) return;
    badge.textContent = text;
    if (status === 'running') {
      badge.className = 'px-1.5 py-0.5 rounded text-[10px] font-mono bg-[#d29922]/20 border border-[#d29922] text-[#d29922]';
    } else if (status === 'success') {
      badge.className = 'px-1.5 py-0.5 rounded text-[10px] font-mono bg-[#238636]/20 border border-[#238636] text-[#7ee787]';
    } else if (status === 'error') {
      badge.className = 'px-1.5 py-0.5 rounded text-[10px] font-mono bg-[#da3633]/20 border border-[#da3633] text-[#f85149]';
    } else {
      badge.className = 'px-1.5 py-0.5 rounded text-[10px] font-mono bg-[#21262d] text-[#8b949e]';
    }
  }

  function openCommandModal(serverName, host, type) {
    cmdModalServer = serverName;
    cmdModalHost = host;
    cmdModalType = type;
    cmdModalRunning = false;

    const hostSpan = document.getElementById('cmd-modal-host');
    if (hostSpan) hostSpan.textContent = host;

    const savedCmd = localStorage.getItem(getStorageKey(type, host)) || '';
    const input = document.getElementById('cmd-modal-input');
    if (input) {
      input.value = savedCmd;
      input.disabled = false;
    }

    const outputSection = document.getElementById('cmd-modal-output-section');
    if (outputSection) outputSection.classList.add('hidden');

    const outputBox = document.getElementById('cmd-modal-output-box');
    if (outputBox) {
      outputBox.innerHTML = '';
      outputBox.className = "flex-1 min-h-0 font-mono text-[11px] bg-[#0d1117] border border-[#30363d] rounded p-3 overflow-y-auto overflow-x-auto whitespace-pre-wrap break-all select-text leading-relaxed text-[#8b949e] max-h-[55vh]";
    }

    setStatusBadge('ready', 'Ready');

    const cancelBtn = document.getElementById('cmd-modal-cancel-btn');
    if (cancelBtn) cancelBtn.textContent = 'Cancel';

    const yesBtn = document.getElementById('cmd-modal-yes-btn');
    if (yesBtn) {
      yesBtn.disabled = savedCmd.trim().length === 0;
      yesBtn.textContent = 'Yes';
    }

    const modal = document.getElementById('cmd-modal');
    if (modal) {
      modal.classList.remove('hidden');
      if (input) {
        setTimeout(() => input.focus(), 50);
      }
    }
  }

  function handleCmdModalInput(val) {
    if (cmdModalType && cmdModalHost) {
      localStorage.setItem(getStorageKey(cmdModalType, cmdModalHost), val);
    }
    const yesBtn = document.getElementById('cmd-modal-yes-btn');
    if (yesBtn && !cmdModalRunning) {
      yesBtn.disabled = val.trim().length === 0;
    }
  }

  function closeCmdModal() {
    const modal = document.getElementById('cmd-modal');
    if (modal) modal.classList.add('hidden');
    cmdModalRunning = false;
  }

  async function runCmdModalAction() {
    const input = document.getElementById('cmd-modal-input');
    const cmd = input ? input.value.trim() : '';
    if (!cmd || cmdModalRunning) return;

    cmdModalRunning = true;
    const yesBtn = document.getElementById('cmd-modal-yes-btn');
    const cancelBtn = document.getElementById('cmd-modal-cancel-btn');
    const outputSection = document.getElementById('cmd-modal-output-section');
    const outputBox = document.getElementById('cmd-modal-output-box');

    if (yesBtn) {
      yesBtn.disabled = true;
      yesBtn.textContent = 'Running...';
    }
    if (input) input.disabled = true;
    if (outputSection) outputSection.classList.remove('hidden');
    setStatusBadge('running', 'Executing...');

    if (outputBox) {
      outputBox.className = "flex-1 min-h-0 font-mono text-[11px] bg-[#0d1117] border border-[#30363d] rounded p-3 overflow-y-auto overflow-x-auto whitespace-pre-wrap break-all select-text leading-relaxed text-[#8b949e] max-h-[55vh]";
      outputBox.textContent = `==> Executing on ${cmdModalHost}...\n$ ${cmd}\n\n`;
      scrollToBottomIfAuto();
    }

    try {
      const res = await fetch('/api/server/' + encodeURIComponent(cmdModalServer) + '/run', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ command: cmd })
      });

      const data = await res.json();
      cmdModalRunning = false;
      if (input) input.disabled = false;

      if (outputBox) {
        let text = outputBox.textContent;
        if (data.output) {
          text += data.output + '\n';
        }
        if (data.success) {
          outputBox.className = "flex-1 min-h-0 font-mono text-[11px] bg-[#0d1117] border border-[#238636] rounded p-3 overflow-y-auto overflow-x-auto whitespace-pre-wrap break-all select-text leading-relaxed text-[#7ee787] max-h-[55vh]";
          text += `\n==> Command completed successfully.`;
          setStatusBadge('success', 'Success');
        } else {
          outputBox.className = "flex-1 min-h-0 font-mono text-[11px] bg-[#0d1117] border border-[#da3633] rounded p-3 overflow-y-auto overflow-x-auto whitespace-pre-wrap break-all select-text leading-relaxed text-[#f85149] max-h-[55vh]";
          text += `\n==> Command exited with error: ${data.error || 'Unknown error'}`;
          setStatusBadge('error', 'Failed');
        }
        outputBox.textContent = text;
        scrollToBottomIfAuto();
      }

      if (yesBtn) {
        yesBtn.disabled = false;
        yesBtn.textContent = 'Run Again';
      }
      if (cancelBtn) {
        cancelBtn.textContent = 'Close';
      }
    } catch (err) {
      cmdModalRunning = false;
      if (input) input.disabled = false;
      if (outputBox) {
        outputBox.className = "flex-1 min-h-0 font-mono text-[11px] bg-[#0d1117] border border-[#da3633] rounded p-3 overflow-y-auto overflow-x-auto whitespace-pre-wrap break-all select-text leading-relaxed text-[#f85149] max-h-[55vh]";
        outputBox.textContent += `\n==> Request failed: ${err.message}`;
        scrollToBottomIfAuto();
      }
      setStatusBadge('error', 'Error');
      if (yesBtn) {
        yesBtn.disabled = false;
        yesBtn.textContent = 'Run Again';
      }
      if (cancelBtn) cancelBtn.textContent = 'Close';
    }
  }

  // Setup auto-scroll listeners
  (function initCmdModalScroll() {
    const outputBox = document.getElementById('cmd-modal-output-box');
    const autoscroll = document.getElementById('cmd-modal-autoscroll');
    if (outputBox && autoscroll) {
      outputBox.addEventListener('scroll', function() {
        const isAtBottom = outputBox.scrollHeight - outputBox.scrollTop - outputBox.clientHeight <= 20;
        if (!isAtBottom && autoscroll.checked) {
          autoscroll.checked = false;
        } else if (isAtBottom && !autoscroll.checked) {
          autoscroll.checked = true;
        }
      });
      autoscroll.addEventListener('change', function() {
        if (this.checked) {
          outputBox.scrollTop = outputBox.scrollHeight;
        }
      });
    }
  })();

  // Keybindings for command modal
  document.addEventListener('keydown', function(e) {
    const modal = document.getElementById('cmd-modal');
    if (!modal || modal.classList.contains('hidden')) return;

    if (e.key === 'Escape') {
      closeCmdModal();
    } else if (e.key === 'Enter' && e.target && e.target.id === 'cmd-modal-input') {
      e.preventDefault();
      const yesBtn = document.getElementById('cmd-modal-yes-btn');
      if (yesBtn && !yesBtn.disabled) {
        runCmdModalAction();
      }
    }
  });
</script>
